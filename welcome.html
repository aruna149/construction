<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | PDF Upload Success</title>
  <meta name="description" content="PDF uploaded successfully. Move forward to the next module.">
  <link rel="stylesheet" href="style.css">
  <script>
    // Immediately apply theme preferences to prevent flash of unstyled content
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
        document.documentElement.classList.add('dark-mode');
      } else {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
</head>
<body class="fade-in">

  <!-- Navigation Bar -->
  <nav class="navbar" aria-label="Main Navigation">
    <div class="nav-container">
      <div class="nav-logo" id="navLogo">
        <!-- SVG PDF Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <span>PDF Upload</span>
      </div>
      <!-- Theme Toggle Button -->
      <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle light or dark mode">
        <!-- Sun Icon (shows in dark mode) -->
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <!-- Moon Icon (shows in light mode) -->
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="main-content">
    <div class="card card-welcome">
      
      <!-- Success Animated Icon -->
      <div class="success-icon-container">
        <svg class="success-svg" viewBox="0 0 80 80" aria-label="Success checkmark">
          <circle class="success-svg-circle" cx="40" cy="40" r="38"/>
          <path class="success-svg-check" d="M23 41.5L34 52.5L57 28.5"/>
        </svg>
      </div>

      <!-- Welcome Message Header -->
      <h1 class="card-title">Welcome!</h1>
      <p class="welcome-message">
        Your PDF has been uploaded successfully.<br>
        You can now continue to the next step of the application.
      </p>

      <!-- Primary Action Button -->
      <button type="button" class="btn btn-primary btn-welcome" id="continueBtn">
        Continue
      </button>

    </div>
  </main>

  <script src="script.js"></script>
  <script>
    document.getElementById('continueBtn').addEventListener('click', () => {
      window.location.href = 'blueprint-analysis/index.html';
    });
  </script>
</body>
</html>
